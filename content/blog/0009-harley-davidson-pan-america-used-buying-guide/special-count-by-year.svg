<text x="770.0" y="515" font-family="sans-serif" font-size="17" fill="#111214" text-anchor="middle" font-weight="400">6</text>
<text x="36" y="168" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">2021</text>
