<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="575" viewBox="0 0 1000 575" role="img" aria-labelledby="title description">
<title id="title">See more than a warm showroom start</title><desc id="description">Arrange cold viewing: Ask ahead; a freshly charged warm bike proves less.; Start and observe: Persistent warnings need diagnosis, not dismissal.; Normal test ride: Check shifts, controls and comfort without unsafe tests.; Hot restart: Recheck starting, leaks and warnings after ordinary use.</desc>
<rect width="1000" height="575" fill="#f4eee3"/>
<text x="36" y="44" font-family="sans-serif" font-size="27" fill="#111214" text-anchor="start" font-weight="700">See more than a warm showroom start</text>
<text x="36" y="78" font-family="sans-serif" font-size="19" fill="#5a5a5e" text-anchor="start" font-weight="400">Only ride with permission, insurance and a roadworthy motorcycle.</text>
<rect x="36" y="135" width="448" height="152" rx="3" fill="none" stroke="#ddd5c7" stroke-width="2"/>
<path d="M36 135H484" stroke="#c4050f" stroke-width="4"/>
<text x="52" y="169" font-family="sans-serif" font-size="23" fill="#111214" text-anchor="start" font-weight="700">Arrange cold viewing</text>
<text x="52" y="200" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">Ask ahead; a freshly charged warm</text>
<text x="52" y="225" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">bike proves less.</text>
<rect x="516" y="135" width="448" height="152" rx="3" fill="none" stroke="#ddd5c7" stroke-width="2"/>
<path d="M516 135H964" stroke="#c4050f" stroke-width="4"/>
<text x="532" y="169" font-family="sans-serif" font-size="23" fill="#111214" text-anchor="start" font-weight="700">Start and observe</text>
<text x="532" y="200" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">Persistent warnings need</text>
<text x="532" y="225" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">diagnosis, not dismissal.</text>
<rect x="36" y="310" width="448" height="152" rx="3" fill="none" stroke="#ddd5c7" stroke-width="2"/>
<path d="M36 310H484" stroke="#c4050f" stroke-width="4"/>
<text x="52" y="344" font-family="sans-serif" font-size="23" fill="#111214" text-anchor="start" font-weight="700">Normal test ride</text>
<text x="52" y="375" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">Check shifts, controls and comfort</text>
<text x="52" y="400" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">without unsafe tests.</text>
<rect x="516" y="310" width="448" height="152" rx="3" fill="none" stroke="#ddd5c7" stroke-width="2"/>
<path d="M516 310H964" stroke="#c4050f" stroke-width="4"/>
<text x="532" y="344" font-family="sans-serif" font-size="23" fill="#111214" text-anchor="start" font-weight="700">Hot restart</text>
<text x="532" y="375" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">Recheck starting, leaks and</text>
<text x="532" y="400" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">warnings after ordinary use.</text>
<text x="36" y="529" font-family="sans-serif" font-size="16" fill="#5a5a5e" text-anchor="start" font-weight="400">Editorial viewing sequence, not a substitute for professional inspection or the owner's manual.</text>
</svg>
