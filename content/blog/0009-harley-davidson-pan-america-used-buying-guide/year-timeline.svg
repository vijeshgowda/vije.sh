<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750" role="img" aria-labelledby="title description">
<title id="title">Model-year changes that matter</title><desc id="description">2021: Base and Special launch. Early specification needs records.; 2022: Display readability and longer hill-hold; modest updates.; 2023: Reported heat, screen, stand and TFT detail revisions.; 2024: Charging/electrical revision; CVO joins the range.; 2025: ST joins; Special's major electrical update is already in place.; 2026: Limited joins; Special detail changes reported in US catalogue.</desc>
<rect width="1000" height="750" fill="#f4eee3"/>
<text x="36" y="44" font-family="sans-serif" font-size="27" fill="#111214" text-anchor="start" font-weight="700">Model-year changes that matter</text>
<text x="36" y="78" font-family="sans-serif" font-size="19" fill="#5a5a5e" text-anchor="start" font-weight="400">Only verified production developments; not a prediction of faults.</text>
<rect x="36" y="135" width="448" height="152" rx="3" fill="none" stroke="#ddd5c7" stroke-width="2"/>
<path d="M36 135H484" stroke="#c4050f" stroke-width="4"/>
<text x="52" y="169" font-family="sans-serif" font-size="23" fill="#111214" text-anchor="start" font-weight="700">2021</text>
<text x="52" y="200" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">Base and Special launch. Early</text>
<text x="52" y="225" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">specification needs records.</text>
<rect x="516" y="135" width="448" height="152" rx="3" fill="none" stroke="#ddd5c7" stroke-width="2"/>
<path d="M516 135H964" stroke="#c4050f" stroke-width="4"/>
<text x="532" y="169" font-family="sans-serif" font-size="23" fill="#111214" text-anchor="start" font-weight="700">2022</text>
<text x="532" y="200" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">Display readability and longer</text>
<text x="532" y="225" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">hill-hold; modest updates.</text>
<rect x="36" y="310" width="448" height="152" rx="3" fill="none" stroke="#ddd5c7" stroke-width="2"/>
<path d="M36 310H484" stroke="#c4050f" stroke-width="4"/>
<text x="52" y="344" font-family="sans-serif" font-size="23" fill="#111214" text-anchor="start" font-weight="700">2023</text>
<text x="52" y="375" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">Reported heat, screen, stand and</text>
<text x="52" y="400" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">TFT detail revisions.</text>
<rect x="516" y="310" width="448" height="152" rx="3" fill="none" stroke="#ddd5c7" stroke-width="2"/>
<path d="M516 310H964" stroke="#c4050f" stroke-width="4"/>
<text x="532" y="344" font-family="sans-serif" font-size="23" fill="#111214" text-anchor="start" font-weight="700">2024</text>
<text x="532" y="375" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">Charging/electrical revision; CVO</text>
<text x="532" y="400" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">joins the range.</text>
<rect x="36" y="485" width="448" height="152" rx="3" fill="none" stroke="#ddd5c7" stroke-width="2"/>
<path d="M36 485H484" stroke="#c4050f" stroke-width="4"/>
<text x="52" y="519" font-family="sans-serif" font-size="23" fill="#111214" text-anchor="start" font-weight="700">2025</text>
<text x="52" y="550" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">ST joins; Special's major</text>
<text x="52" y="575" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">electrical update is already in</text>
<text x="52" y="600" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">place.</text>
<rect x="516" y="485" width="448" height="152" rx="3" fill="none" stroke="#ddd5c7" stroke-width="2"/>
<path d="M516 485H964" stroke="#c4050f" stroke-width="4"/>
<text x="532" y="519" font-family="sans-serif" font-size="23" fill="#111214" text-anchor="start" font-weight="700">2026</text>
<text x="532" y="550" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">Limited joins; Special detail</text>
<text x="532" y="575" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">changes reported in US catalogue.</text>
<text x="36" y="704" font-family="sans-serif" font-size="16" fill="#5a5a5e" text-anchor="start" font-weight="400">Sources: BikeSocial, Carandbike, RoadRUNNER, Motorcycle.com, ADV Pulse and Harley-Davidson.</text>
</svg>
