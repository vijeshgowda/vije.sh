name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Dev-only tooling (ESLint, test runners) never ships to the site; report it without failing.
      - name: Report development dependency advisories (non-blocking)
        run: |
          if ! npm audit --package-lock-only --include=dev --audit-level=moderate; then
            echo "::warning title=Development dependency advisories::npm audit found moderate or higher advisories in development-only dependencies (or could not reach the registry). See this step's log."
          fi
      - name: Audit locked runtime dependencies
        run: npm audit --package-lock-only --omit=dev --audit-level=moderate
      - name: Audit the Omni signalling server (deployed to Render)
        run: npm audit --package-lock-only --omit=dev --audit-level=moderate
        working-directory: services/omni-signaling
