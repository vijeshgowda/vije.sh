<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750" role="img" aria-labelledby="title description">
<title id="title">Five names, different buying briefs</title><desc id="description">Base 1250: Original entry model; conventional adjustable suspension.; Special: Adventure/touring kit and semi-active suspension; verify ARH.; CVO / from MY2024: Premium factory finish and equipment on the 1250 platform.; ST / from MY2025: Road wheels and shorter travel; try it for road-only use.; Limited / MY2026: Factory-equipped touring package; check payload and price.; Check the VIN: Registration year alone does not establish model year.</desc>
<rect width="1000" height="750" fill="#f4eee3"/>
<text x="36" y="44" font-family="sans-serif" font-size="27" fill="#111214" text-anchor="start" font-weight="700">Five names, different buying briefs</text>
<text x="36" y="78" font-family="sans-serif" font-size="19" fill="#5a5a5e" text-anchor="start" font-weight="400">A specification map, not a ranking of reliability.</text>
<rect x="36" y="135" width="448" height="152" rx="3" fill="none" stroke="#ddd5c7" stroke-width="2"/>
<path d="M36 135H484" stroke="#c4050f" stroke-width="4"/>
<text x="52" y="169" font-family="sans-serif" font-size="23" fill="#111214" text-anchor="start" font-weight="700">Base 1250</text>
<text x="52" y="200" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">Original entry model; conventional</text>
<text x="52" y="225" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">adjustable suspension.</text>
<rect x="516" y="135" width="448" height="152" rx="3" fill="none" stroke="#ddd5c7" stroke-width="2"/>
<path d="M516 135H964" stroke="#c4050f" stroke-width="4"/>
<text x="532" y="169" font-family="sans-serif" font-size="23" fill="#111214" text-anchor="start" font-weight="700">Special</text>
<text x="532" y="200" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">Adventure/touring kit and semi-</text>
<text x="532" y="225" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">active suspension; verify ARH.</text>
<rect x="36" y="310" width="448" height="152" rx="3" fill="none" stroke="#ddd5c7" stroke-width="2"/>
<path d="M36 310H484" stroke="#c4050f" stroke-width="4"/>
<text x="52" y="344" font-family="sans-serif" font-size="23" fill="#111214" text-anchor="start" font-weight="700">CVO / from MY2024</text>
<text x="52" y="375" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">Premium factory finish and</text>
<text x="52" y="400" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">equipment on the 1250 platform.</text>
<rect x="516" y="310" width="448" height="152" rx="3" fill="none" stroke="#ddd5c7" stroke-width="2"/>
<path d="M516 310H964" stroke="#c4050f" stroke-width="4"/>
<text x="532" y="344" font-family="sans-serif" font-size="23" fill="#111214" text-anchor="start" font-weight="700">ST / from MY2025</text>
<text x="532" y="375" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">Road wheels and shorter travel;</text>
<text x="532" y="400" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">try it for road-only use.</text>
<rect x="36" y="485" width="448" height="152" rx="3" fill="none" stroke="#ddd5c7" stroke-width="2"/>
<path d="M36 485H484" stroke="#c4050f" stroke-width="4"/>
<text x="52" y="519" font-family="sans-serif" font-size="23" fill="#111214" text-anchor="start" font-weight="700">Limited / MY2026</text>
<text x="52" y="550" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">Factory-equipped touring package;</text>
<text x="52" y="575" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">check payload and price.</text>
<rect x="516" y="485" width="448" height="152" rx="3" fill="none" stroke="#ddd5c7" stroke-width="2"/>
<path d="M516 485H964" stroke="#c4050f" stroke-width="4"/>
<text x="532" y="519" font-family="sans-serif" font-size="23" fill="#111214" text-anchor="start" font-weight="700">Check the VIN</text>
<text x="532" y="550" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">Registration year alone does not</text>
<text x="532" y="575" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">establish model year.</text>
<text x="36" y="704" font-family="sans-serif" font-size="16" fill="#5a5a5e" text-anchor="start" font-weight="400">Sources: period launch reports and Harley-Davidson UK model pages linked in the article.</text>
</svg>
