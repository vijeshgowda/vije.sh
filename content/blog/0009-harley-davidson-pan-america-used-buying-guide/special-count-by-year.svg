<text x="300" y="548" font-family="sans-serif" font-size="18" fill="#111214" text-anchor="start" font-weight="400">Special adverts; zero-based scale</text>
<text x="36" y="594" font-family="sans-serif" font-size="16" fill="#5a5a5e" text-anchor="start" font-weight="400">Source: first 20 Autotrader UK Pan America adverts, 27 Oct 2026. Asking prices, not sales. Full register</text>
