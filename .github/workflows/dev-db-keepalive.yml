name: Dev database keepalive

# Supabase Free pauses a project after 7 idle days. Vercel Cron only runs on production, so the
# dev project is pinged from here (database.md section 10).
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
    steps:
      - name: select 1
        if: env.DEV_DATABASE_URL != ''
        env:
          PGSSLMODE: require
        run: psql "$DEV_DATABASE_URL" --no-psqlrc --quiet --tuples-only --command "select 1"
