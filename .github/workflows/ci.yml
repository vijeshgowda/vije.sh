name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: >-
      ${{ !(
        (github.event_name == 'pull_request' && (
          startsWith(github.event.pull_request.title, 'chore:') ||
          startsWith(github.event.pull_request.title, 'chore(') ||
          startsWith(github.event.pull_request.title, 'chore!:')
        )) ||
        (github.event_name == 'push' && (
          startsWith(github.event.head_commit.message, 'chore:') ||
          startsWith(github.event.head_commit.message, 'chore(') ||
          startsWith(github.event.head_commit.message, 'chore!:')
        ))
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:54329/postgres
      FEEDS_OFFLINE: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - name: Test database (also proves every migration applies)
        run: npm run db:test:setup
      - name: Unit, component and integration tests with coverage limits
        run: npm run test:coverage
      - name: Build (same variables Playwright passes to next start)
        run: npm run build
        env:
          DATABASE_URL: postgres://postgres:test@localhost:54329/postgres
          AUTH_MODE: test
          TEST_AUTH_SECRET: ci-test-auth-secret-not-for-production
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      - run: npx playwright install --with-deps chromium
      - name: Feature tests
        run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: "1"
          TEST_AUTH_SECRET: ci-test-auth-secret-not-for-production
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e 'const t=require("./coverage/coverage-summary.json").total;const r=["lines","statements","functions","branches"].map(k=>`| ${k} | ${t[k].pct}% |`);console.log(["### Coverage","| metric | % |","|---|---|",...r].join("\n"))' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            coverage/
            playwright-report/
          retention-days: 14
