<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title description">
<title id="title">How thin is the year-by-year evidence?</title><desc id="description">2021: 5; 2022: 3; 2023: 4; 2024: 1; 2025: 1. One advertised 2024 and one 2025 cannot establish a typical market value.</desc>
<rect width="1000" height="640" fill="#f4eee3"/>
<text x="36" y="44" font-family="sans-serif" font-size="27" fill="#111214" text-anchor="start" font-weight="700">How thin is the year-by-year evidence?</text>
<text x="36" y="78" font-family="sans-serif" font-size="19" fill="#5a5a5e" text-anchor="start" font-weight="400">One advertised 2024 and one 2025 cannot establish a typical market value.</text>
