<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="442" viewBox="0 0 1000 442" role="img" aria-labelledby="title description">
<title id="title">Measured wet weight depends on the test</title><desc id="description">2021 CW test bike: 604 lb; 2022 CW test bike: 577 lb. Different bikes, equipment and test configurations; not a 27 lb factory year-on-year reduction.</desc>
<rect width="1000" height="442" fill="#f4eee3"/>
<text x="36" y="44" font-family="sans-serif" font-size="27" fill="#111214" text-anchor="start" font-weight="700">Measured wet weight depends on the test</text>
<text x="36" y="78" font-family="sans-serif" font-size="19" fill="#5a5a5e" text-anchor="start" font-weight="400">Different bikes, equipment and test configurations; not a 27 lb factory year-on-year</text>
<text x="36" y="103" font-family="sans-serif" font-size="19" fill="#5a5a5e" text-anchor="start" font-weight="400">reduction.</text>
<path d="M300.0 125V287" stroke="#ddd5c7"/>
<text x="300.0" y="317" font-family="sans-serif" font-size="17" fill="#111214" text-anchor="middle" font-weight="400">0</text>
<path d="M417.5 125V287" stroke="#ddd5c7"/>
<text x="417.5" y="317" font-family="sans-serif" font-size="17" fill="#111214" text-anchor="middle" font-weight="400">175</text>
<path d="M535.0 125V287" stroke="#ddd5c7"/>
<text x="535.0" y="317" font-family="sans-serif" font-size="17" fill="#111214" text-anchor="middle" font-weight="400">350</text>
<path d="M652.5 125V287" stroke="#ddd5c7"/>
<text x="652.5" y="317" font-family="sans-serif" font-size="17" fill="#111214" text-anchor="middle" font-weight="400">525</text>
<path d="M770.0 125V287" stroke="#ddd5c7"/>
<text x="770.0" y="317" font-family="sans-serif" font-size="17" fill="#111214" text-anchor="middle" font-weight="400">700</text>
<text x="36" y="168" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">2021 CW test bike</text>
<rect x="300" y="145" width="405.543" height="34" fill="#c4050f"/>
<text x="717.5428571428572" y="169" font-family="sans-serif" font-size="21" fill="#111214" text-anchor="start" font-weight="700">604 lb</text>
<text x="36" y="234" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">2022 CW test bike</text>
<rect x="300" y="211" width="387.414" height="34" fill="#c4050f"/>
<text x="699.4142857142857" y="235" font-family="sans-serif" font-size="21" fill="#111214" text-anchor="start" font-weight="700">577 lb</text>
<text x="300" y="350" font-family="sans-serif" font-size="18" fill="#111214" text-anchor="start" font-weight="400">Cycle World measured wet pounds; zero-based scale</text>
<text x="36" y="396" font-family="sans-serif" font-size="16" fill="#5a5a5e" text-anchor="start" font-weight="400">Sources: Cycle World 2021 and 2022 comparisons. These are not Harley's running-order claims.</text>
</svg>
