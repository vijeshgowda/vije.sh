<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="508" viewBox="0 0 1000 508" role="img" aria-labelledby="title description">
<title id="title">Pump-price sensitivity</title><desc id="description">£1.30 / litre: £788; £1.50 / litre: £909; £1.70 / litre: £1,030. Illustration: 6,000 miles at 45 imperial mpg; not a current pump-price survey.</desc>
<rect width="1000" height="508" fill="#f4eee3"/>
<text x="36" y="44" font-family="sans-serif" font-size="27" fill="#111214" text-anchor="start" font-weight="700">Pump-price sensitivity</text>
<text x="36" y="78" font-family="sans-serif" font-size="19" fill="#5a5a5e" text-anchor="start" font-weight="400">Illustration: 6,000 miles at 45 imperial mpg; not a current pump-price survey.</text>
<path d="M300.0 125V353" stroke="#ddd5c7"/>
<text x="300.0" y="383" font-family="sans-serif" font-size="17" fill="#111214" text-anchor="middle" font-weight="400">0</text>
<path d="M417.5 125V353" stroke="#ddd5c7"/>
<text x="417.5" y="383" font-family="sans-serif" font-size="17" fill="#111214" text-anchor="middle" font-weight="400">300</text>
<path d="M535.0 125V353" stroke="#ddd5c7"/>
<text x="535.0" y="383" font-family="sans-serif" font-size="17" fill="#111214" text-anchor="middle" font-weight="400">600</text>
<path d="M652.5 125V353" stroke="#ddd5c7"/>
<text x="652.5" y="383" font-family="sans-serif" font-size="17" fill="#111214" text-anchor="middle" font-weight="400">900</text>
<path d="M770.0 125V353" stroke="#ddd5c7"/>
<text x="770.0" y="383" font-family="sans-serif" font-size="17" fill="#111214" text-anchor="middle" font-weight="400">1,200</text>
<text x="36" y="168" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">£1.30 / litre</text>
<rect x="300" y="145" width="308.629" height="34" fill="#c4050f"/>
<text x="620.6289988888889" y="169" font-family="sans-serif" font-size="21" fill="#111214" text-anchor="start" font-weight="700">£788</text>
<text x="36" y="234" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">£1.50 / litre</text>
<rect x="300" y="211" width="356.110" height="34" fill="#c4050f"/>
<text x="668.1103833333334" y="235" font-family="sans-serif" font-size="21" fill="#111214" text-anchor="start" font-weight="700">£909</text>
<text x="36" y="300" font-family="sans-serif" font-size="20" fill="#111214" text-anchor="start" font-weight="400">£1.70 / litre</text>
<rect x="300" y="277" width="403.592" height="34" fill="#c4050f"/>
<text x="715.5917677777777" y="301" font-family="sans-serif" font-size="21" fill="#111214" text-anchor="start" font-weight="700">£1,030</text>
<text x="300" y="416" font-family="sans-serif" font-size="18" fill="#111214" text-anchor="start" font-weight="400">GBP per year; zero-based scale</text>
<text x="36" y="462" font-family="sans-serif" font-size="16" fill="#5a5a5e" text-anchor="start" font-weight="400">Calculation: 6,000 / 45 × 4.54609 × assumed pounds per litre. Rounded to nearest pound.</text>
</svg>
