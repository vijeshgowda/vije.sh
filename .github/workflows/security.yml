name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Audit locked runtime and development dependencies
        run: npm audit --package-lock-only --include=dev --audit-level=moderate
